{{ $bdir := regexSplit ( list .chezmoi.homeDir "/" | join "" ) .bindir -1 | last }}
{{ $cdir := regexSplit ( list .chezmoi.homeDir "/" | join "" ) .compdir -1 | last }}

[".config/bat/themes/Catppuccin-mocha.tmTheme"]
  type = "file"
  url = "https://raw.githubusercontent.com/catppuccin/bat/main/themes/Catppuccin%20Mocha.tmTheme"
  refreshPeriod = "24h"

[".config/btop/themes/catppuccin_mocha.theme"]
 type = "file"
 url = "https://raw.githubusercontent.com/catppuccin/btop/main/themes/catppuccin_mocha.theme"
 refreshPeriod = "24h"

{{ if eq .chezmoi.os "linux" }}

["{{- $bdir -}}/fzf"]
  type = "archive-file"
  url = "https://github.com/junegunn/fzf/releases/download/{{ (gitHubLatestRelease "junegunn/fzf").TagName }}/fzf-{{ trimPrefix "v" (gitHubLatestRelease "junegunn/fzf").TagName }}-linux_amd64.tar.gz"
  path = "fzf"
  executable = true

["{{- $bdir -}}/starship"]
  type = "archive-file"
  url = "https://github.com/starship/starship/releases/download/{{ (gitHubLatestRelease "starship/starship").TagName }}/starship-x86_64-unknown-linux-musl.tar.gz"
  path = "starship"
  executable = true

["{{- $bdir -}}/rg"]
  type = "archive-file"
  url = "https://github.com/BurntSushi/ripgrep/releases/download/{{ (gitHubLatestRelease "BurntSushi/ripgrep").TagName }}/ripgrep-{{ (gitHubLatestRelease "BurntSushi/ripgrep").TagName }}-x86_64-unknown-linux-musl.tar.gz"
  path = "ripgrep-{{ (gitHubLatestRelease "BurntSushi/ripgrep").TagName }}-x86_64-unknown-linux-musl/rg"
  executable = true

["{{- $bdir -}}/bat"]
  type = "archive-file"
  url = "https://github.com/sharkdp/bat/releases/download/{{ (gitHubLatestRelease "sharkdp/bat").TagName }}/bat-{{ (gitHubLatestRelease "sharkdp/bat").TagName }}-x86_64-unknown-linux-musl.tar.gz"
  path = "bat-{{ (gitHubLatestRelease "sharkdp/bat").TagName }}-x86_64-unknown-linux-musl/bat"
  executable = true

["{{- $bdir -}}/btop"]
  type = "archive-file"
  url = "https://github.com/aristocratos/btop/releases/download/{{ (gitHubLatestRelease "aristocratos/btop").TagName }}/btop-x86_64-unknown-linux-musl.tar.gz"
  path = "./btop/bin/btop"
  executable = true

["{{- $bdir -}}/gh"]
  type = "archive-file"
  url = "https://github.com/cli/cli/releases/download/{{ (gitHubLatestRelease "cli/cli").TagName }}/gh_{{ trimPrefix "v" (gitHubLatestRelease "cli/cli").TagName }}_linux_amd64.tar.gz"
  path = "gh_{{ trimPrefix "v" (gitHubLatestRelease "cli/cli").TagName }}_linux_amd64/bin/gh"
  executable = true

# neovim: the release tarball is split into bin/share/lib so the binary finds its runtime
{{- range $dir := list "bin" "share" "lib" }}

[".local/share/nvim-dist/{{ $dir }}"]
  type = "archive"
  url = "https://github.com/neovim/neovim/releases/download/{{ (gitHubLatestRelease "neovim/neovim").TagName }}/nvim-linux-x86_64.tar.gz"
  exact = true
  include = ["*/{{ $dir }}/**"]
  stripComponents = 2
{{- end }}

["{{- $bdir -}}/jq"]
  type = "file"
  url = "https://github.com/stedolan/jq/releases/download/{{ (gitHubLatestRelease "stedolan/jq").TagName }}/jq-linux64"
  executable = true

{{ end }}

{{ if eq .chezmoi.os "darwin" }}

["{{- $cdir -}}/fzf"]
  type = "file"
  url = "https://raw.githubusercontent.com/junegunn/fzf/{{ (gitHubLatestRelease "junegunn/fzf").TagName }}/shell/completion.zsh"

[".bashrc.d/50-fzf-key-bindings.sh"]
  type = "file"
  url = "https://raw.githubusercontent.com/junegunn/fzf/{{ (gitHubLatestRelease "junegunn/fzf").TagName }}/shell/key-bindings.zsh"


["{{- $bdir -}}/starship"]
  type = "file"
  url = "https://github.com/starship/starship/releases/download/{{ (gitHubLatestRelease "starship/starship").TagName }}/starship-x86_64-apple-darwin.tar.gz"
  executable = true
  ["{{- $bdir -}}/starship" .filter]
    command = "tar"
    args = ["--extract", "--file", "/dev/stdin", "--gzip", "--to-stdout", "starship"]

["{{- $bdir -}}/rg"]
  type = "file"
  url = "https://github.com/BurntSushi/ripgrep/releases/download/{{ (gitHubLatestRelease "BurntSushi/ripgrep").TagName }}/ripgrep-{{ (gitHubLatestRelease "BurntSushi/ripgrep").TagName }}-aarch64-apple-darwin.tar.gz"
  executable = true
  ["{{- $bdir -}}/rg" .filter]
    command = "tar"
    args = ["--extract", "--file", "/dev/stdin", "--gzip", "--strip-components=1", "--to-stdout", "*/rg"]

["{{- $bdir -}}/jq"]
  type = "file"
  url = "https://github.com/stedolan/jq/releases/download/{{ (gitHubLatestRelease "stedolan/jq").TagName }}/jq-osx-amd64"
  executable = true

{{ end }}
